name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: importguard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: importguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U importguard -d importguard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: importguard
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: importguard_test
      IMPORTGUARD_TEST_DATABASE: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.15"

      - name: Install locked Python dependencies
        run: uv sync --locked --python 3.12

      - name: Check formatting
        run: uv run ruff format --check importguard tests

      - name: Lint
        run: uv run ruff check importguard tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migration consistency
        run: uv run alembic check

      - name: Run all tests with PostgreSQL
        run: uv run python -m pytest -q

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Type-check and build frontend
        run: npm --prefix frontend run build
